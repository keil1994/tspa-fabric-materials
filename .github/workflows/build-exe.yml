name: Build tSPA Designer (Windows)
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyside6 pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name tSPA_Designer tspa_designer_gui.py
        working-directory: tools
      - uses: actions/upload-artifact@v4
        with:
          name: tSPA_Designer-windows
          path: tools/dist/tSPA_Designer.exe
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: tools/dist/tSPA_Designer.exe
